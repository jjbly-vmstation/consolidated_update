---
# Direct LAN access to Jellyfin without DNS/ingress.
# Reachable at http://<any-node-ip>:30096 (e.g. http://192.168.4.61:30096),
# which matches JELLYFIN_PublishedServerUrl in the deployment.
# Coexists with the ClusterIP service and the nginx ingress (jellyfin.jjbly.uk);
# safe to delete once proper LAN DNS is in place.
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-nodeport
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: media-server
spec:
  type: NodePort
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 30096
      name: http
      protocol: TCP
  selector:
    app: jellyfin
    component: media-server
