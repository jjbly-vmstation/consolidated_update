---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
  namespace: jellyfin
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/component: media-server
spec:
  # NodePort so Jellyfin is reachable at http://storagenodet3500.local:30096
  # (also works via any other node's .local hostname) — matches
  # JELLYFIN_PublishedServerUrl in deployment.yaml.
  type: NodePort
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 30096
      name: http
      protocol: TCP
  selector:
    app: jellyfin
    component: media-server
