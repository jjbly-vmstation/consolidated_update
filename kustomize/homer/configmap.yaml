apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homer
data:
  settings.yaml: |
    title: jjbly homelab
    theme: dark
    color: slate
    headerStyle: boxed
    hideVersion: true
    layout:
      Media:
        icon: mdi-play-circle
        style: row
        columns: 4
      Productivity:
        icon: mdi-cloud-outline
        style: row
        columns: 4
      Monitoring:
        icon: mdi-chart-line
        style: row
        columns: 4
      Infrastructure:
        icon: mdi-server-network
        style: row
        columns: 4

  services.yaml: |
    - name: "Productivity"
      icon: "fas fa-briefcase"
      items:
        - name: "Nextcloud"
          url: "http://masternode.local:30301"
          subtitle: "Files & Sync"
          icon: "fas fa-cloud"
        - name: "Vaultwarden"
          url: "http://masternode.local:30302"
          subtitle: "Password Manager"
          icon: "fas fa-key"
        - name: "Documents (Paperless)"
          url: "http://masternode.local:31000"
          subtitle: "Scanned documents (paperless-ngx)"
          icon: "fas fa-file-alt"
          target: "_blank"
        - name: "Web Scanner (Scanservjs)"
          url: "http://masternode.local:30808"
          subtitle: "Trigger scans directly from browser"
          icon: "fas fa-print"
          target: "_blank"
        - name: "CUPS"
          url: "http://masternode.local:30631"
          subtitle: "Printer management"
          icon: "fas fa-print"
          target: "_blank"

    - Infrastructure:
        - storagenodet3500:
            href: "#"
            description: NAS / Storage Node
            icon: mdi-harddisk
            widget:
              type: customapi
              url: http://nodectl.nodectl.svc.cluster.local:8080/status
              refreshInterval: 15000
              mappings:
                - field: text
                  label: Status
                  format: text
        - Wake Storage:
            href: http://masternode.local:30304/wol
            description: Power on storagenodet3500
            icon: mdi-power
            target: _blank
        - Sleep Storage:
            href: http://masternode.local:30304/shutdown
            description: Shutdown storagenodet3500
            icon: mdi-sleep
            target: _blank

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        label: Cluster Resources

    - search:
        provider: google
        target: _blank
        focus: false

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: disabled