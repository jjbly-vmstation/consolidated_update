apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homer
data:
  settings.yaml: |
    title: jjbly homelab
    theme: dark
    color: slate
    headerStyle: boxed
    hideVersion: true
    layout:
      Media:
        icon: mdi-play-circle
        style: row
        columns: 4
      Productivity:
        icon: mdi-cloud-outline
        style: row
        columns: 4
      Monitoring:
        icon: mdi-chart-line
        style: row
        columns: 4
      Infrastructure:
        icon: mdi-server-network
        style: row
        columns: 4

  services.yaml: |
    - Media:
        - Jellyfin:
            href: http://masternode.local:30096
            description: Movies, TV & Music
            icon: jellyfin.png

    - Productivity:
        - Nextcloud:
            href: http://masternode.local:30301
            description: Files & Sync
            icon: nextcloud.png
        - Vaultwarden:
            href: http://masternode.local:30302
            description: Password Manager
            icon: vaultwarden.png
        - Documents (Paperless):
            href: http://masternode.local:31000
            description: Scanned documents (paperless-ngx)
            icon: mdi-file-document
            target: _blank
        - CUPS:
            href: http://masternode.local:30631
            description: Printer management
            icon: mdi-printer
            target: _blank

    - Monitoring:
        - Grafana:
            href: http://masternode.local:30303
            description: Dashboards & Alerts
            icon: grafana.png
        - Prometheus:
            href: http://masternode.local:30090
            description: Metrics
            icon: prometheus.png

    - Infrastructure:
        - storagenodet3500:
            href: "#"
            description: NAS / Storage Node
            icon: mdi-harddisk
            widget:
              type: customapi
              url: http://nodectl.nodectl.svc.cluster.local:8080/status
              refreshInterval: 15000
              mappings:
                - field: text
                  label: Status
                  format: text
        - Wake Storage:
            href: http://masternode.local:30304/wol
            description: Power on storagenodet3500
            icon: mdi-power
            target: _blank
        - Sleep Storage:
            href: http://masternode.local:30304/shutdown
            description: Shutdown storagenodet3500
            icon: mdi-sleep
            target: _blank

  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        label: Cluster Resources

    - search:
        provider: google
        target: _blank
        focus: false

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: disabled