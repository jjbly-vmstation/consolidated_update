---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: mariadb
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: app
spec:
  # NodePort so Nextcloud is reachable at http://masternode.local:30301
  # from any node's local mDNS hostname — see docs/NEXTCLOUD_SSL.md
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30301
  selector:
    app: nextcloud
