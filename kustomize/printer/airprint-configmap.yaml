apiVersion: v1
kind: ConfigMap
metadata:
  name: avahi-airprint-config
  namespace: print
data:
  airprint.service: |
    <?xml version="1.0" ?>
    <!DOCTYPE service-group SYSTEM "avahi-service-group.dtd">
    <service-group>
      <name replace-wildcards="yes">Brother Printer (AirPrint)</name>
      <service>
        <type>_ipp._tcp</type>
        <subtype>_universal._sub._ipp._tcp</subtype>
        <port>631</port>
        <txt-record>txtvers=1</txt-record>
        <txt-record>qtotal=1</txt-record>
        <txt-record>Transparent=T</txt-record>
        <txt-record>URF=none</txt-record>
        <!-- Replace "Brother_MFC" below with your exact CUPS printer queue name if different -->
        <txt-record>rp=printers/Brother_MFC</txt-record>
        <txt-record>note=Office Printer</txt-record>
        <txt-record>product=(Brother MFC-9130CW)</txt-record>
        <txt-record>pdl=application/pdf,image/jpeg,image/urf,application/octet-stream</txt-record>
        <txt-record>printer-state=3</txt-record>
        <txt-record>printer-type=0x480B00C</txt-record>
      </service>
    </service-group>