apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-samba
  namespace: print
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scan-samba
  template:
    metadata:
      labels:
        app: scan-samba
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: storagenodet3500.vmstation.local
      containers:
        - name: samba
          image: dperson/samba:latest
          args:
            - "-u"
            - "scanneruser;scanpass"
            - "-s"
            - "ScanShare;/share/ScanShare;yes;no;no;scanneruser"
            # Enable SMB1/NT1 support for older Brother hardware
            - "-g"
            - "server min protocol = NT1"
            - "-g"
            - "client min protocol = NT1"
            - "-g"
            - "ntlm auth = yes"
          env:
            - name: TZ
              value: "UTC"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          volumeMounts:
            - name: scan-storage
              mountPath: /share/ScanShare
      volumes:
        - name: scan-storage
          persistentVolumeClaim:
            claimName: pvc-scan-storage
