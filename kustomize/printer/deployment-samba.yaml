apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-config
  namespace: print
data:
  smb.conf: |
    [global]
       workgroup = WORKGROUP
       server string = Samba Server
       server role = standalone server
       log level = 2
       
       # Enable SMB1/NT1 support for older Brother scanners
       server min protocol = NT1
       client min protocol = NT1
       ntlm auth = yes

    [ScanShare]
       path = /share/ScanShare
       browseable = yes
       read only = no
       guest ok = no
       valid users = scanneruser
       force user = root
       force group = root
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-samba
  namespace: print
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scan-samba
  template:
    metadata:
      labels:
        app: scan-samba
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: storagenodet3500.vmstation.local
      containers:
        - name: samba
          image: dperson/samba:latest
          args:
            - "-u"
            - "scanneruser;scanpass"
          volumeMounts:
            - name: samba-config
              mountPath: /etc/samba/smb.conf
              subPath: smb.conf
            - name: scan-storage
              mountPath: /share/ScanShare
      volumes:
        - name: samba-config
          configMap:
            name: samba-config
        - name: scan-storage
          persistentVolumeClaim:
            claimName: pvc-scan-storage
---
apiVersion: v1
kind: Service
metadata:
  name: scan-samba
  namespace: print
spec:
  selector:
    app: scan-samba
  type: ClusterIP
  ports:
    - port: 445
      targetPort: 445
      protocol: TCP