apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanservjs
  namespace: print
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scanservjs
  template:
    metadata:
      labels:
        app: scanservjs
    spec:
      # Custom image (below) only exists in containerd's local store on
      # storagenodet3500 - no registry involved - so the pod must land
      # there or imagePullPolicy: Never will make it fail to schedule.
      nodeSelector:
        kubernetes.io/hostname: storagenodet3500.vmstation.local
      containers:
        - name: scanservjs
          # Custom image with Brother's brscan4 SANE backend baked in -
          # see kustomize/printer/scanservjs-brother/. Built locally on
          # storagenodet3500 via nerdctl/containerd, not pulled from a
          # registry.
          image: localhost/scanservjs-brother:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: scan-storage
              mountPath: /var/scans
      volumes:
        - name: scan-storage
          persistentVolumeClaim:
            claimName: pvc-scan-storage
---
apiVersion: v1
kind: Service
metadata:
  name: scanservjs
  namespace: print
spec:
  type: NodePort
  selector:
    app: scanservjs
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30808