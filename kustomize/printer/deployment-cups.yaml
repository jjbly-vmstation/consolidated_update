apiVersion: apps/v1
kind: Deployment
metadata:
  name: cups
  namespace: print
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cups-avahi
  template:
    metadata:
      labels:
        app: cups-avahi
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: storagenodet3500.vmstation.local
      containers:
        - name: cups
          image: ydkn/cups:latest
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # 1. Set admin password
                    echo 'admin:adminpassword' | chpasswd

                    # 2. Wait briefly for cupsd daemon to initialize
                    sleep 3

                    # 3. Auto-add Brother MFC-9130CW printer queue
                    lpadmin -p Brother_MFC_9130CW \
                      -E \
                      -v socket://192.168.4.72:9100 \
                      -m raw \
                      -L "Office" \
                      -D "Brother MFC-9130CW" \
                      -o printer-is-shared=true

                    # 4. Set as default system printer
                    lpadmin -d Brother_MFC_9130CW
          env:
            - name: CUPS_ADMIN_USER
              value: "admin"
            - name: CUPS_ADMIN_PASSWORD
              value: "adminpassword"
          ports:
            - containerPort: 631
              name: ipp
              protocol: TCP
          volumeMounts:
            - name: cups-config
              mountPath: /etc/cups
            - name: cups-services
              mountPath: /etc/avahi/services
      volumes:
        - name: cups-config
          hostPath:
            path: /srv/cups/config
            type: DirectoryOrCreate
        - name: cups-services
          hostPath:
            path: /srv/cups/services
            type: DirectoryOrCreate